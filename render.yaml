# Render Blueprint - https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> point at this repo.
# It will create the web service below; you still need to set these
# env vars yourself (Render intentionally won't store secrets
# in a file that's committed to git) - see DEPLOY.md.

services:
  - type: web
    name: cloud-ai-ids-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false   # set manually in the Render dashboard - never commit this
      - key: SUPABASE_SERVICE_KEY
        sync: false   # set manually in the Render dashboard - never commit this
      - key: OPENAI_API_KEY
        sync: false   # optional - powers the "Analyze" button; omit to leave that feature disabled
      - key: OPENAI_MODEL
        value: gpt-5.4  # optional override, e.g. gpt-5.5 once you want to switch
